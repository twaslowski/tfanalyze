name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: |
          uv sync
          uv run coverage run -m pytest
          uv run coverage html
          uv run coverage xml -o test/coverage.xml
          uv run coverage-badge -f -o test/coverage.svg

