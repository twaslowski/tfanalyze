[project]
name = "tfanalyze"
version = "0.4.0"
description = "Lightweight command-line utility to analyze Terraform plan files"

authors = [{ name = "Tobias Waslowski", email = "contact@twaslowski.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = ["click>=8.1.7,<9"]

[project.scripts]
tfanalyze = "tfanalyze.cli:tfanalyze"

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "pytest-cov>=5.0.0,<6",
    "coverage-badge>=1.1.1,<2",
    "setuptools>=80.9.0,<81",
    "black>=26.5.1",
    "isort>=8.0.1",
    "autoflake>=2.3.3",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
